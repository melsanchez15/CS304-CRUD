{% extends "base.html" %}

{% block main_content %}
<h1>Select Movie</h1>

<form method=POST>
    <label for="menu-tt">Movies without release dates or directors:</label>
    <select id="menu-tt" name="menu-tt">
        <option value = 'none'>Choose One</option>
        {%for movie in movies%}
        <option value = "{{movie['movie-tt']}}" >{{movie['title']}}</option>
        {%endfor%}
    </select>
    <br>
    <button type = 'submit'>Submit</button>
</form>

{% endblock %}
