{% extends "base.html" %}

{% block main_content %}
<ul>
<li><a href="{{url_for('index')}}">Home</a></li>
</ul>
<h1>Select Movie</h1>

<form method = "POST" action= "{{ url_for('select') }}">
    <label for= "menu-tt" >Movies without release dates or directors:</label>
    <select id= "menu-tt" name= "menu-tt">
        <option value = "none" >Select Movie</option>
        {% for movie in movies %}
        <option value = "{{ movie.tt }}" >{{ movie.title }}</option>
        {% endfor %}
    </select>
    <br>
    <input type = "submit" name = 'submit' value = ' Submit' >
</form>

{% endblock %}
